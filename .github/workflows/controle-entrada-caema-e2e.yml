name: Controle Entrada CAEMA - E2E

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  lint-e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar o backend
        working-directory: backend
        run: mvn -B compile

      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm ci

      - name: Lint do frontend
        working-directory: frontend
        run: npm run lint

      - name: Build do frontend
        working-directory: frontend
        run: npm run build

  e2e:
    needs: lint-e-build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: controle_entrada
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Sao_Paulo
          PGTZ: America/Sao_Paulo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TZ: America/Sao_Paulo
      DATABASE_URL: jdbc:postgresql://localhost:5432/controle_entrada
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: chave-de-teste-somente-para-ci-0123456789-nao-use-em-producao
      CORS_ORIGENS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ADMIN_MATRICULA: admin
      ADMIN_SENHA: admin123
      VITE_API_URL: http://localhost:8080/api
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:8080/api
      E2E_ADMIN_MATRICULA: admin
      E2E_ADMIN_SENHA: admin123

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build do backend (sem testes unitarios, so empacota)
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Subir o backend em background
        working-directory: backend
        run: |
          nohup java -jar target/controle-entrada.jar > backend.log 2>&1 &
          echo "Aguardando /actuator/health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend no ar."
              exit 0
            fi
            sleep 2
          done
          echo "Backend nao respondeu a tempo. Log:"
          cat backend.log
          exit 1

      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm ci

      - name: Build do frontend
        working-directory: frontend
        run: npm run build

      - name: Servir o frontend (preview) em background
        working-directory: frontend
        run: |
          nohup npm run preview -- --port 5173 --strictPort > frontend.log 2>&1 &
          echo "Aguardando o frontend responder..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Frontend no ar."
              exit 0
            fi
            sleep 2
          done
          echo "Frontend nao respondeu a tempo. Log:"
          cat frontend.log
          exit 1

      - name: Instalar dependencias do E2E
        working-directory: e2e
        run: npm ci

      - name: Instalar navegadores do Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes E2E
        working-directory: e2e
        run: npm test

      - name: Publicar relatorio do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Publicar logs do backend/frontend em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend/backend.log
            frontend/frontend.log
          retention-days: 14
