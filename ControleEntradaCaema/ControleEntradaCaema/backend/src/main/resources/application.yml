server:
  port: ${PORT:8080}

spring:
  application:
    name: controle-entrada-caema

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/controle_entrada}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-para-uma-string-bem-grande-e-aleatoria-0123456789}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:600}
  cors:
    origens-permitidas: ${CORS_ORIGENS:http://localhost:5173}
  admin:
    # Usado apenas na primeira inicializacao para criar o admin caso nao exista nenhum usuario.
    matricula: ${ADMIN_MATRICULA:admin}
    senha: ${ADMIN_SENHA:admin123}
    nome: ${ADMIN_NOME:Administrador do Sistema}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    br.com.caema.controleentrada: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
