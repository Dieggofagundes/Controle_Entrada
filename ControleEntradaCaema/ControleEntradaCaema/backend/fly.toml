# Configuracao de deploy do backend no Fly.io
# Antes do primeiro deploy, troque o "app" abaixo por um nome unico
# (o `fly launch` tambem pode gerar/gravar isso automaticamente).
app = "controle-entrada-caema-api"
primary_region = "gru"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/actuator/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
