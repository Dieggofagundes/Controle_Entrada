# Ambiente de desenvolvimento local.
# Uso:
#   docker compose up -d          # sobe apenas o banco (para rodar o backend pela IDE/mvn)
#   docker compose --profile full up -d --build   # sobe banco + backend containerizado
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: caema-postgres
    environment:
      POSTGRES_DB: controle_entrada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - caema_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: caema-backend
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/controle_entrada
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: chave-de-desenvolvimento-nao-use-em-producao-0123456789
      CORS_ORIGENS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"

volumes:
  caema_postgres_data:
